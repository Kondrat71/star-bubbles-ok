    <title>Звёздные пузыри: Пять миров</title>
    <!-- Площадка: Одноклассники. SDK площадки и переходник вместо Яндекс SDK. -->

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background: radial-gradient(ellipse at 50% 30%, #1d2550 0%, #0b1030 55%, #05061a 100%);
      }
      #space {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: 0;
        background: linear-gradient(180deg, #0b1030 0%, #1d2550 100%);
      }
      .space-layer {
        position: absolute;
        inset: -20px;
        transition: transform 0.4s ease-out;
      }
      .space-stars {
        position: absolute;
        left: 0;
        right: 0;
        top: -256px;
        bottom: 0;
        background-repeat: repeat;
        background-size: 256px 256px;
        will-change: transform;
        animation: space-drift 40s linear infinite;
      }
      @keyframes space-drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(0, 256px, 0);
        }
      }
      .lowfx .space-stars {
        animation: none;
        will-change: auto;
      }
      .lowfx .space-layer + .space-layer {
        display: none;
      }
      #game {
        position: fixed;
        inset: 0;
        z-index: 1;
      }
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-nCugjg5Q.js"></script>
  </head>
